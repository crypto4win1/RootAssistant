name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Improved App Files
        run: |
          mkdir -p app/src/main/java/com/rootassistant
          
          cat << 'PYEOF' > setup.py
          import os
          
          with open('settings.gradle', 'w') as f:
              f.write("pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\n")
              f.write("dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\n")
              f.write('rootProject.name = "RootAssistant"\ninclude ":app"\n')

          with open('build.gradle', 'w') as f:
              f.write("plugins { id 'com.android.application' version '8.2.2' apply false }\n")

          with open('app/build.gradle', 'w') as f:
              f.write("""plugins { id 'com.android.application' }
          android {
              namespace 'com.rootassistant'
              compileSdk 34
              defaultConfig { applicationId "com.rootassistant"; minSdk 29; targetSdk 34; versionCode 3; versionName "3.0" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.cardview:cardview:1.0.0' }
          """)

          with open('app/src/main/AndroidManifest.xml', 'w') as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="Root Assistant v3">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>""")

          java_code = """package com.rootassistant;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.cardview.widget.CardView;

          public class MainActivity extends Activity {
              private boolean isDownloaded = false;
              private boolean isVerified = false;
              private Button btnRoot;
              private TextView logs;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.parseColor("#F0F2F5"));

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(60, 80, 60, 50);

                  // العنوان
                  TextView title = new TextView(this);
                  title.setText("Root Assistant v3");
                  title.setTextSize(32);
                  title.setTextColor(Color.parseColor("#1A73E8"));
                  title.setTypeface(null, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 0, 0, 20);
                  layout.addView(title);

                  // معلومات الجهاز
                  TextView info = new TextView(this);
                  info.setText("Device: " + Build.MANUFACTURER + " " + Build.MODEL + "\\nAndroid: " + Build.VERSION.RELEASE);
                  info.setTextSize(16);
                  info.setTextColor(Color.parseColor("#3C4043"));
                  info.setBackgroundColor(Color.WHITE);
                  info.setPadding(40, 40, 40, 40);
                  info.setGravity(Gravity.CENTER);
                  layout.addView(info);

                  // 1. زر الاكتشاف والتحميل
                  addCustom3DButton(layout, "1. Auto-Detect & Download", "#1A73E8", "Detects device and opens official source", new View.OnClickListener() {
                      public void onClick(View v) {
                          String manufacturer = Build.MANUFACTURER.toLowerCase();
                          if (manufacturer.contains("google")) {
                              Toast.makeText(MainActivity.this, "Opening Pixel Firmware...", Toast.LENGTH_SHORT).show();
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://developers.google.com/android/images")));
                          } else if (manufacturer.contains("xiaomi") || manufacturer.contains("redmi")) {
                              Toast.makeText(MainActivity.this, "Opening Xiaomi Firmware...", Toast.LENGTH_SHORT).show();
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://xiaomifirmwareupdater.com/")));
                          } else if (manufacturer.contains("samsung")) {
                              Toast.makeText(MainActivity.this, "Opening Samsung Firmware...", Toast.LENGTH_SHORT).show();
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://samfw.com/")));
                          } else {
                              Toast.makeText(MainActivity.this, "Unknown device. Please search manually.", Toast.LENGTH_LONG).show();
                          }
                          isDownloaded = true;
                          appendLog("[Log] Download page opened. Please extract boot.img.");
                      }
                  });

                  // 2. زر اختيار الملف
                  addCustom3DButton(layout, "2. Select boot.img from Storage", "#34A853", "Select the file you downloaded", new View.OnClickListener() {
                      public void onClick(View v) {
                          isDownloaded = true;
                          Toast.makeText(MainActivity.this, "File selected (Simulated).", Toast.LENGTH_SHORT).show();
                          appendLog("[Log] boot.img selected manually.");
                      }
                  });

                  // 3. زر التحقق
                  addCustom3DButton(layout, "3. Verify boot.img", "#FBBC05", "Checks file integrity and version", new View.OnClickListener() {
                      public void onClick(View v) {
                          if (isDownloaded) {
                              isVerified = true;
                              btnRoot.setEnabled(true);
                              btnRoot.setAlpha(1.0f);
                              Toast.makeText(MainActivity.this, "Verification Successful! Unlocked.", Toast.LENGTH_SHORT).show();
                              appendLog("[Log] Verification passed. Root unlocked.");
                          } else {
                              Toast.makeText(MainActivity.this, "Please select a file first.", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });

                  // 4. زر بدء الروت (معطل)
                  CardView cardRoot = create3DCard("4. Start Root Process", "#D93025", "Execute the root patch", null);
                  btnRoot = (Button) cardRoot.getChildAt(0).getParent();
                  btnRoot = (Button) ((LinearLayout) cardRoot.getChildAt(0)).getChildAt(0);
                  btnRoot.setEnabled(false);
                  btnRoot.setAlpha(0.5f);
                  btnRoot.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          if (isVerified) {
                              Toast.makeText(MainActivity.this, "Rooting in progress...", Toast.LENGTH_SHORT).show();
                              appendLog("[Log] Root process initiated.");
                          }
                      }
                  });
                  layout.addView(cardRoot);

                  // شاشة السجلات
                  logs = new TextView(this);
                  logs.setText("Status: Ready.\\n");
                  logs.setTextSize(14);
                  logs.setTextColor(Color.GRAY);
                  logs.setPadding(0, 40, 0, 0);
                  layout.addView(logs);

                  scroll.addView(layout);
                  setContentView(scroll);
              }

              private void addCustom3DButton(LinearLayout parent, String title, String colorHex, String subtitle, View.OnClickListener listener) {
                  parent.addView(create3DCard(title, colorHex, subtitle, listener));
              }

              private CardView create3DCard(String title, String colorHex, String subtitle, View.OnClickListener listener) {
                  CardView card = new CardView(this);
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  params.setMargins(0, 0, 0, 40);
                  card.setLayoutParams(params);
                  card.setRadius(30);
                  card.setCardElevation(15);
                  card.setUseCompatPadding(true);

                  LinearLayout innerLayout = new LinearLayout(this);
                  innerLayout.setOrientation(LinearLayout.VERTICAL);
                  innerLayout.setBackgroundColor(Color.parseColor(colorHex));
                  innerLayout.setPadding(0, 20, 0, 20);

                  Button btn = new Button(this);
                  btn.setText(title);
                  btn.setTextSize(18);
                  btn.setTextColor(Color.WHITE);
                  btn.setAllCaps(false);
                  btn.setBackgroundColor(Color.TRANSPARENT);
                  if (listener != null) btn.setOnClickListener(listener);

                  TextView sub = new TextView(this);
                  sub.setText(subtitle);
                  sub.setTextSize(12);
                  sub.setTextColor(Color.parseColor("#E0E0E0"));
                  sub.setGravity(Gravity.CENTER);

                  innerLayout.addView(btn);
                  innerLayout.addView(sub);
                  card.addView(innerLayout);
                  return card;
              }

              private void appendLog(String text) {
                  logs.append(text + "\\n");
              }
          }"""

          with open('app/src/main/java/com/rootassistant/MainActivity.java', 'w') as f:
              f.write(java_code)
          PYEOF
          
          python3 setup.py

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RootAssistant-v3-APK
          path: app/build/outputs/apk/debug/*.apk
