name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Create Files via Base64
        run: |
          mkdir -p app/src/main/java/com/rootassistant
          
          echo "" | tr -d ' \n' | base64 -d > settings.gradle
          
          echo "b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWHRydWUKa290bGluLmNvZGUuc3R5bGU9b2ZmaWNpYWwKYW5kcm9pZC5ub25UcmFuc2l0aXZlUkNsYXNzPXRydWUK" | tr -d ' \n' | base64 -d > gradle.properties
          
          echo "" | tr -d ' \n' | base64 -d > app/build.gradle
          
          echo "" | tr -d ' \n' | base64 -d > app/src/main/AndroidManifest.xml
          
          echo "" | tr -d ' \n' | base64 -d > app/src/main/java/com/rootassistant/MainActivity.kt

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RootAssistant-APK
          path: app/build/outputs/apk/debug/*.apk
