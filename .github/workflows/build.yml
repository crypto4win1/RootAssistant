name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Corrected 3D UI Files
        run: |
          mkdir -p app/src/main/java/com/rootassistant
          
          # 1. إعدادات المشروع
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
          echo 'rootProject.name = "RootAssistant"' >> settings.gradle
          echo 'include ":app"' >> settings.gradle

          # 2. إعدادات البناء (تمت إضافة مكتبة CardView)
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { namespace 'com.rootassistant'; compileSdk 34; defaultConfig { applicationId 'com.rootassistant'; minSdk 29; targetSdk 34; versionCode 1; versionName '1.0' }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }" >> app/build.gradle
          echo "dependencies { implementation 'androidx.cardview:cardview:1.0.0' }" >> app/build.gradle

          # 3. ملف البيان
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="Root Assistant"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

          # 4. كود Java (مشفر Base64 لضمان عدم وجود أخطاء)
          echo "" | base64 -d > app/src/main/java/com/rootassistant/MainActivity.java

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RootAssistant-APK
          path: app/build/outputs/apk/debug/*.apk
