name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Auto-Detect Downloader App
        run: |
          mkdir -p app/src/main/java/com/rootassistant
          
          cat << 'PYEOF' > setup.py
          import os
          
          with open('settings.gradle', 'w') as f:
              f.write("pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\n")
              f.write("dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\n")
              f.write('rootProject.name = "RootAssistant"\ninclude ":app"\n')

          with open('build.gradle', 'w') as f:
              f.write("plugins { id 'com.android.application' version '8.2.2' apply false }\n")

          with open('app/build.gradle', 'w') as f:
              f.write("""plugins { id 'com.android.application' }
          android {
              namespace 'com.rootassistant'
              compileSdk 34
              defaultConfig { applicationId "com.rootassistant"; minSdk 29; targetSdk 34; versionCode 2; versionName "2.0" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.cardview:cardview:1.0.0' }
          """)

          with open('app/src/main/AndroidManifest.xml', 'w') as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="Root Assistant" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>""")

          java_code = """package com.rootassistant;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.cardview.widget.CardView;

          public class MainActivity extends Activity {
              private boolean isDownloaded = false;
              private Button btnRoot;
              private TextView logs;
              private DownloadManager downloadManager;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  downloadManager = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.parseColor("#F0F2F5"));

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(60, 80, 60, 50);

                  TextView title = new TextView(this);
                  title.setText("Root Assistant v2");
                  title.setTextSize(32);
                  title.setTextColor(Color.parseColor("#1A73E8"));
                  title.setTypeface(null, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 0, 0, 20);
                  layout.addView(title);

                  TextView info = new TextView(this);
                  info.setText("Device: " + Build.MANUFACTURER + " " + Build.MODEL + "\\nAndroid: " + Build.VERSION.RELEASE);
                  info.setTextSize(16);
                  info.setTextColor(Color.parseColor("#3C4043"));
                  info.setBackgroundColor(Color.WHITE);
                  info.setPadding(40, 40, 40, 40);
                  info.setGravity(Gravity.CENTER);
                  layout.addView(info);

                  // زر الاكتشاف والتحميل التلقائي
                  CardView cardAuto = create3DButton("Auto-Detect & Download boot.img", "#1A73E8", null);
                  Button btnAuto = (Button) cardAuto.getChildAt(0);
                  btnAuto.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          detectAndDownload();
                      }
                  });
                  layout.addView(cardAuto);

                  // روابط بديلة
                  layout.addView(create3DButton("Fallback: Download Pixel Firmware", "#34A853", "https://developers.google.com/android/images"));
                  layout.addView(create3DButton("Fallback: Download Samsung Firmware", "#EA4335", "https://samfw.com/"));
                  layout.addView(create3DButton("Fallback: Download Xiaomi Firmware", "#FBBC05", "https://www.miui.com/download.html"));

                  // زر بدء الروت (معطل)
                  CardView cardRoot = create3DButton("3. Start Root Process", "#D93025", null);
                  btnRoot = (Button) cardRoot.getChildAt(0);
                  btnRoot.setEnabled(false);
                  btnRoot.setAlpha(0.5f);
                  btnRoot.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          if (isDownloaded) {
                              Toast.makeText(MainActivity.this, "Rooting...", Toast.LENGTH_SHORT).show();
                              appendLog("[Log] Root process initiated.");
                          } else {
                              Toast.makeText(MainActivity.this, "Please download boot.img first.", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });
                  layout.addView(cardRoot);

                  // شاشة السجلات
                  logs = new TextView(this);
                  logs.setText("Status: Ready.\\n");
                  logs.setTextSize(14);
                  logs.setTextColor(Color.GRAY);
                  logs.setPadding(0, 40, 0, 0);
                  layout.addView(logs);

                  scroll.addView(layout);
                  setContentView(scroll);
              }

              private void detectAndDownload() {
                  String manufacturer = Build.MANUFACTURER.toLowerCase();
                  String model = Build.MODEL;
                  String display = Build.DISPLAY;
                  appendLog("[Log] Detecting device: " + manufacturer + " " + model);

                  // محاولة تحديد رابط لجهاز Pixel (مثال)
                  if (manufacturer.contains("google")) {
                      // رابط افتراضي لجهاز Pixel (يجب تحديثه حسب الطراز الفعلي)
                      String url = "https://dl.google.com/dl/android/aosp/raven-ota-sq3a.220705.004.a1-9d3e3e5d.zip";
                      String fileName = "pixel_factory_image.zip";
                      downloadFile(url, fileName);
                  } else {
                      appendLog("[Log] Auto-download not fully supported for " + manufacturer + ". Please use fallback links.");
                      Toast.makeText(this, "Auto-download not supported for this device. Use fallback links.", Toast.LENGTH_LONG).show();
                  }
              }

              private void downloadFile(String url, String fileName) {
                  try {
                      DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                      request.setTitle("Downloading boot.img");
                      request.setDescription("Downloading " + fileName);
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);
                      request.setAllowedOverMetered(true);
                      request.setAllowedOverRoaming(true);

                      long downloadId = downloadManager.enqueue(request);
                      appendLog("[Log] Download started (ID: " + downloadId + "). Check notifications.");
                      Toast.makeText(this, "Download started. Check notifications.", Toast.LENGTH_SHORT).show();
                      isDownloaded = true;
                      btnRoot.setEnabled(true);
                      btnRoot.setAlpha(1.0f);
                  } catch (Exception e) {
                      appendLog("[Error] " + e.getMessage());
                      Toast.makeText(this, "Download failed: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              private CardView create3DButton(String text, String colorHex, String url) {
                  CardView card = new CardView(this);
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 160
                  );
                  params.setMargins(0, 0, 0, 30);
                  card.setLayoutParams(params);
                  card.setRadius(30);
                  card.setCardElevation(15);
                  card.setUseCompatPadding(true);

                  Button btn = new Button(this);
                  btn.setText(text);
                  btn.setTextSize(16);
                  btn.setTextColor(Color.WHITE);
                  btn.setAllCaps(false);
                  GradientDrawable shape = new GradientDrawable();
                  shape.setCornerRadius(30);
                  shape.setColor(Color.parseColor(colorHex));
                  btn.setBackground(shape);

                  if (url != null) {
                      btn.setOnClickListener(new View.OnClickListener() {
                          public void onClick(View v) {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                          }
                      });
                  }
                  card.addView(btn);
                  return card;
              }

              private void appendLog(String text) {
                  logs.append(text + "\\n");
              }
          }"""

          with open('app/src/main/java/com/rootassistant/MainActivity.java', 'w') as f:
              f.write(java_code)
          PYEOF
          
          python3 setup.py

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RootAssistant-AutoDetect-APK
          path: app/build/outputs/apk/debug/*.apk
