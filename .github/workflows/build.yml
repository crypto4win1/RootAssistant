name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Modern UI Java Files
        run: |
          mkdir -p app/src/main/java/com/rootassistant
          
          cat << 'PYEOF' > setup.py
          import os
          
          with open('settings.gradle', 'w') as f:
              f.write("pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\n")
              f.write("dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\n")
              f.write('rootProject.name = "RootAssistant"\ninclude ":app"\n')

          with open('build.gradle', 'w') as f:
              f.write("plugins { id 'com.android.application' version '8.2.2' apply false }\n")

          with open('app/build.gradle', 'w') as f:
              f.write("""plugins { id 'com.android.application' }
          android {
              namespace 'com.rootassistant'
              compileSdk 34
              defaultConfig { applicationId "com.rootassistant"; minSdk 29; targetSdk 34; versionCode 1; versionName "1.0" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          """)

          with open('app/src/main/AndroidManifest.xml', 'w') as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="Root Assistant">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>""")

          java_code = """package com.rootassistant;
          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.parseColor("#F6F8FA"));

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(50, 80, 50, 50);

                  TextView title = new TextView(this);
                  title.setText("Root Assistant");
                  title.setTextSize(28);
                  title.setTextColor(Color.parseColor("#1F6FEB"));
                  title.setTypeface(null, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 0, 0, 40);
                  layout.addView(title);

                  TextView info = new TextView(this);
                  info.setText("Device: " + Build.MANUFACTURER + " " + Build.MODEL + "\\nAndroid: " + Build.VERSION.RELEASE);
                  info.setTextSize(16);
                  info.setTextColor(Color.parseColor("#24292F"));
                  info.setBackgroundColor(Color.parseColor("#FFFFFF"));
                  info.setPadding(40, 40, 40, 40);
                  info.setGravity(Gravity.CENTER);
                  layout.addView(info);

                  TextView sp1 = new TextView(this);
                  sp1.setHeight(60);
                  layout.addView(sp1);

                  Button btnSelect = createButton("1. Select boot.img", "#1F6FEB");
                  btnSelect.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) { Toast.makeText(MainActivity.this, "Selecting boot.img...", Toast.LENGTH_SHORT).show(); }
                  });
                  layout.addView(btnSelect);

                  Button btnVerify = createButton("2. Verify boot.img", "#2EA043");
                  btnVerify.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) { Toast.makeText(MainActivity.this, "Verifying...", Toast.LENGTH_SHORT).show(); }
                  });
                  layout.addView(btnVerify);

                  Button btnRoot = createButton("3. Start Root Process", "#D73A49");
                  btnRoot.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) { Toast.makeText(MainActivity.this, "Initiating Root Process...", Toast.LENGTH_SHORT).show(); }
                  });
                  layout.addView(btnRoot);

                  TextView logs = new TextView(this);
                  logs.setText("Status: Waiting for input...\\n\\n[Log] App Started Successfully.");
                  logs.setTextSize(14);
                  logs.setTextColor(Color.GRAY);
                  logs.setPadding(0, 50, 0, 0);
                  layout.addView(logs);

                  scroll.addView(layout);
                  setContentView(scroll);
              }

              private Button createButton(String text, String colorHex) {
                  Button btn = new Button(this);
                  btn.setText(text);
                  btn.setTextSize(16);
                  btn.setTextColor(Color.WHITE);
                  GradientDrawable shape = new GradientDrawable();
                  shape.setCornerRadius(30);
                  shape.setColor(Color.parseColor(colorHex));
                  btn.setBackground(shape);
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 150
                  );
                  params.setMargins(0, 0, 0, 30);
                  btn.setLayoutParams(params);
                  return btn;
              }
          }"""

          with open('app/src/main/java/com/rootassistant/MainActivity.java', 'w') as f:
              f.write(java_code)
          PYEOF
          
          python3 setup.py

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RootAssistant-APK
          path: app/build/outputs/apk/debug/*.apk
