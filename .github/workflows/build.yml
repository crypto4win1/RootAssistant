name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Java Project Files (Base64)
        run: |
          mkdir -p app/src/main/java/com/rootassistant
          
          # 1. إعدادات المشروع
          echo "" | base64 -d > settings.gradle

          # 2. إعدادات البناء
          echo "cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguMi4yJyBhcHBseSBmYWxzZQp9Cg==" | base64 -d > build.gradle

          echo "" | base64 -d > app/build.gradle

          # 3. ملف البيان (تم تغيير الاسم إلى Root Assistant)
          echo "" | base64 -d > app/src/main/AndroidManifest.xml

          # 4. كود Java للواجهة الجديدة
          echo "" | base64 -d > app/src/main/java/com/rootassistant/MainActivity.java

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RootAssistant-APK
          path: app/build/outputs/apk/debug/*.apk
