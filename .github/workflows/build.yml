name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Generate Project Files via Python
        run: |
          cat << 'PYEOF' > setup.py
          import os
          os.makedirs('app/src/main/java/com/rootassistant', exist_ok=True)

          with open('settings.gradle', 'w') as f:
              f.write("""pluginManagement {
                  repositories { google(); mavenCentral(); gradlePluginPortal() }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories { google(); mavenCentral() }
              }
              rootProject.name = "RootAssistant"
              include ":app"
              """)

          with open('gradle.properties', 'w') as f:
              f.write("android.useAndroidX=true\nandroid.nonTransitiveRClass=true\n")

          with open('app/build.gradle', 'w') as f:
              f.write("""plugins {
                  id 'com.android.application' version '8.2.2'
                  id 'org.jetbrains.kotlin.android' version '1.9.22'
              }
              android {
                  namespace 'com.rootassistant'
                  compileSdk 34
                  defaultConfig {
                      applicationId "com.rootassistant"
                      minSdk 29
                      targetSdk 34
                      versionCode 1
                      versionName "1.0"
                  }
                  buildFeatures { compose true }
                  composeOptions { kotlinCompilerExtensionVersion '1.5.8' }
                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
                  kotlinOptions { jvmTarget = '17' }
              }
              dependencies {
                  implementation platform('androidx.compose:compose-bom:2024.02.00')
                  implementation 'androidx.activity:activity-compose:1.8.2'
                  implementation 'androidx.compose.material3:material3'
              }
              """)

          with open('app/src/main/AndroidManifest.xml', 'w') as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <application android:theme="@android:style/Theme.Material.Light.NoActionBar">
                      <activity android:name=".MainActivity" android:exported="true">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>
              """)

          with open('app/src/main/java/com/rootassistant/MainActivity.kt', 'w') as f:
              f.write("""package com.rootassistant

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.Text
          import androidx.compose.material3.MaterialTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          Text("Hello from Root Assistant!")
                      }
                  }
              }
          }
          """)
          PYEOF
          
          python3 setup.py

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RootAssistant-APK
          path: app/build/outputs/apk/debug/*.apk
