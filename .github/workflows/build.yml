name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Simple Project
        run: |
          mkdir -p app/src/main/java/com/example/simple
          
          # إعدادات المشروع الأساسية
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
          echo 'rootProject.name = "SimpleApp"' >> settings.gradle
          echo 'include ":app"' >> settings.gradle
          
          # إعدادات البناء
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { namespace 'com.example.simple'; compileSdk 34; defaultConfig { applicationId 'com.example.simple'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' } }" >> app/build.gradle
          
          # ملف البيان
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Simple App"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          # كود جافا بسيط جداً
          echo 'package com.example.simple; import android.app.Activity; import android.os.Bundle; import android.widget.TextView; import android.view.Gravity; public class MainActivity extends Activity { @Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); TextView tv = new TextView(this); tv.setText("The App Works!"); tv.setGravity(Gravity.CENTER); setContentView(tv); } }' > app/src/main/java/com/example/simple/MainActivity.java

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Simple-App-APK
          path: app/build/outputs/apk/debug/*.apk
